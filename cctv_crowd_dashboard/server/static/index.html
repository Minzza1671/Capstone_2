<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crowd Risk Dashboard</title>
<script src="/static/chart.min.js"></script>
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --txt:#e6edf3; --dim:#8b949e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:system-ui,'Segoe UI',sans-serif;
         height:100vh; display:flex; flex-direction:column; overflow:hidden; }

  header { padding:10px 20px; border-bottom:1px solid var(--line);
           display:flex; align-items:center; gap:12px; flex-shrink:0; }
  header h1 { font-size:15px; font-weight:700; letter-spacing:1px; }
  #cam  { font-size:12px; color:var(--dim); }
  #conn { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--dim); }
  #clock { margin-left:auto; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; }

  .wrap { display:grid; grid-template-columns:1.5fr 1fr; gap:14px; padding:14px;
          flex:1; min-height:0; }

  .cctv { background:#000; border:1px solid var(--line); border-radius:10px;
          overflow:hidden; display:flex; flex-direction:column; }
  .cctv img { width:100%; flex:1; min-height:0; object-fit:contain; display:block; }

  .side { display:flex; flex-direction:column; gap:10px; overflow-y:auto; }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }

  /* 위험등급 배지 */
  #badge { font-size:44px; font-weight:800; letter-spacing:3px; text-align:center;
           padding:18px; border-radius:8px; transition:all .3s; }
  #flag  { font-size:11px; color:#ffae57; margin-top:8px; display:none; }

  /* 수치 3개 */
  .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
  .metric { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px; }
  .metric .k { font-size:11px; color:var(--dim); margin-bottom:4px; }
  .metric .v { font-size:22px; font-weight:700; line-height:1; }
  .metric .u { font-size:11px; color:var(--dim); font-weight:400; }

  /* 차트 */
  .chart-hdr { margin-bottom:8px; }
  .chart-hdr .label { font-size:11px; color:var(--dim); font-weight:600;
                      text-transform:uppercase; letter-spacing:1px; }

  /* 경보 이력 */
  .sec-label { font-size:11px; color:var(--dim); font-weight:600;
               text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .hist-list { display:flex; flex-direction:column; gap:4px; }
  .hist-row { display:flex; align-items:center; gap:8px; padding:6px 8px;
              border-radius:6px; background:var(--bg); font-size:12px; }
  .hist-row .ts { color:var(--dim); flex-shrink:0; font-variant-numeric:tabular-nums; }
  .hist-row .hl { font-weight:700; flex-shrink:0; min-width:72px; }
  .hist-row .hd { color:var(--dim); margin-left:auto; }
  .no-hist { font-size:12px; color:var(--dim); text-align:center; padding:8px 0; }
</style>
</head>
<body>

<header>
  <h1>CROWD RISK DASHBOARD</h1>
  <span id="cam"></span>
  <span id="conn">● 연결 중</span>
  <span id="clock"></span>
</header>

<div class="wrap">

  <!-- 좌: CCTV 영상 -->
  <div class="cctv">
    <img id="stream" src="/stream" alt="CCTV">
  </div>

  <!-- 우: 위험도 패널 -->
  <div class="side">

    <!-- 위험등급 -->
    <div class="panel">
      <div id="badge" style="background:#1b2129;color:#8b949e">—</div>
      <div id="flag">⚠ 인원 부족 — 국소밀도 신뢰도 낮음</div>
    </div>

    <!-- 핵심 수치 -->
    <div class="panel">
      <div class="metrics">
        <div class="metric">
          <div class="k">국소 밀도</div>
          <div class="v"><span id="ld">0.00</span><span class="u"> 명/㎡</span></div>
        </div>
        <div class="metric">
          <div class="k">현재 인원</div>
          <div class="v"><span id="cnt">0</span><span class="u"> 명</span></div>
        </div>
        <div class="metric">
          <div class="k">평균 속도</div>
          <div class="v"><span id="sp">0.00</span><span class="u"> m/s</span></div>
        </div>
      </div>
    </div>

    <!-- 밀도 추세 -->
    <div class="panel">
      <div class="chart-hdr">
        <span class="label">밀도 추세 (명/㎡)</span>
      </div>
      <canvas id="chart" height="110"></canvas>
    </div>

    <!-- 경보 이력 -->
    <div class="panel">
      <div class="sec-label">경보 이력</div>
      <div class="hist-list" id="hist-list">
        <div class="no-hist">경보 없음</div>
      </div>
    </div>

  </div>
</div>

<script>
const COLORS = {
  NORMAL:"#00c800", CAUTION:"#ffd000", WARNING:"#ffa500",
  DANGER:"#ff5000", CRITICAL:"#ff0000"
};
const MAXPTS = 120;

// 시계
function tickClock(){
  document.getElementById('clock').textContent =
    new Date().toLocaleString('ko-KR',{hour12:false});
}
tickClock(); setInterval(tickClock, 1000);

// 차트 위험 구간 플러그인
const BANDS = [
  [0,1.6,'NORMAL'],[1.6,2.4,'CAUTION'],[2.4,3.2,'WARNING'],
  [3.2,4.0,'DANGER'],[4.0,99,'CRITICAL']
];
const zonePlugin = {
  id:'zones',
  beforeDraw(chart){
    const {ctx, chartArea:{left,right,top,bottom}, scales:{y}} = chart;
    if(!y) return;
    ctx.save();
    for(const [lo,hi,lv] of BANDS){
      let yhi=y.getPixelForValue(Math.min(hi,y.max));
      let ylo=y.getPixelForValue(Math.max(lo,y.min));
      yhi=Math.max(yhi,top); ylo=Math.min(ylo,bottom);
      if(ylo<=yhi) continue;
      ctx.fillStyle=COLORS[lv]+'22';
      ctx.fillRect(left,yhi,right-left,ylo-yhi);
    }
    for(const [v,c] of [[3.2,'#ff5000'],[4.0,'#ff0000']]){
      const yp=y.getPixelForValue(v);
      if(yp<top||yp>bottom) continue;
      ctx.strokeStyle=c; ctx.lineWidth=1; ctx.setLineDash([5,4]);
      ctx.beginPath(); ctx.moveTo(left,yp); ctx.lineTo(right,yp); ctx.stroke();
    }
    ctx.restore();
  }
};

let chart = null;
try {
  if(typeof Chart === "undefined") throw new Error("no Chart.js");
  chart = new Chart(document.getElementById('chart'),{
    type:'line',
    data:{ labels:[], datasets:[
      { label:'국소밀도', data:[], borderColor:'#ff4d4d', borderWidth:2.5,
        backgroundColor:'rgba(255,77,77,.08)', fill:true, tension:.3, pointRadius:0 },
      { label:'전역밀도', data:[], borderColor:'#58a6ff', borderWidth:1,
        borderDash:[4,3], tension:.3, pointRadius:0 },
    ]},
    options:{ animation:false, responsive:true,
      scales:{
        x:{ ticks:{ color:'#8b949e', maxTicksLimit:6, font:{size:10} }, grid:{ color:'#2a313c' } },
        y:{ min:0, suggestedMax:5,
            ticks:{ color:'#8b949e', font:{size:10} }, grid:{ color:'#2a313c' } },
      },
      plugins:{ legend:{ display:false } }
    },
    plugins:[zonePlugin]
  });
} catch(e){ console.error("chart init:", e); }

// 경보 이력
const alerts = [];
const MAX_HIST = 8;
let lastLevel = "NORMAL";

function pushAlert(ts, level, density){
  alerts.unshift({ts, level, density});
  if(alerts.length > MAX_HIST) alerts.pop();
  renderHist();
}

function renderHist(){
  const el = document.getElementById('hist-list');
  if(!alerts.length){ el.innerHTML='<div class="no-hist">경보 없음</div>'; return; }
  el.innerHTML = alerts.map(a=>{
    const c = COLORS[a.level];
    const t = new Date(a.ts*1000).toLocaleTimeString('ko-KR',{hour12:false});
    return `<div class="hist-row">
      <span class="ts">${t}</span>
      <span class="hl" style="color:${c}">${a.level}</span>
      <span class="hd">${a.density.toFixed(2)} 명/㎡</span>
    </div>`;
  }).join('');
}

function fmt(n,d=2){ return (n??0).toFixed(d); }

function update(r){
  const lvl = r.risk_level || "NORMAL";
  const c = COLORS[lvl] || "#8b949e";

  const badge = document.getElementById('badge');
  badge.textContent = lvl;
  badge.style.background = c+"22";
  badge.style.color = c;
  badge.style.boxShadow = (lvl==="DANGER"||lvl==="CRITICAL") ? `0 0 28px ${c}88` : "none";

  document.getElementById('ld').textContent  = fmt(r.local_max_density);
  document.getElementById('cnt').textContent = r.roi_person_count ?? 0;
  document.getElementById('sp').textContent  = fmt(r.mean_speed);

  const cam = document.getElementById('cam');
  cam.textContent = r.camera_id || "";

  const flag = document.getElementById('flag');
  flag.style.display = (r.local_reliable === false) ? 'block' : 'none';

  const now = r.ts ? r.ts : Date.now()/1000;
  const localD = r.local_max_density ?? 0;

  if(chart){
    const t = new Date(now*1000).toLocaleTimeString('ko-KR',{hour12:false});
    const ch = chart.data;
    ch.labels.push(t);
    ch.datasets[0].data.push(localD);
    ch.datasets[1].data.push(r.global_density ?? 0);
    if(ch.labels.length > MAXPTS){ ch.labels.shift(); ch.datasets.forEach(d=>d.data.shift()); }
    chart.update();
  }

  // 경보 이력: 등급 변화 시 기록 (NORMAL 제외)
  if(lvl !== lastLevel && lvl !== "NORMAL") pushAlert(now, lvl, localD);
  lastLevel = lvl;
}

let ws;
function connect(){
  const proto = location.protocol==="https:"?"wss":"ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  const conn = document.getElementById('conn');
  ws.onopen    = ()=>{ conn.textContent="● 연결됨"; conn.style.color="#00c800"; };
  ws.onmessage = e=>{ try{ update(JSON.parse(e.data)); }catch(_){} };
  ws.onclose   = ()=>{ conn.textContent="● 끊김"; conn.style.color="#ff5000";
                       setTimeout(connect,1500); };
  ws.onerror   = ()=> ws.close();
}
connect();
setInterval(()=>{ if(ws&&ws.readyState===1) ws.send("ping"); }, 10000);
</script>
</body>
</html>
